name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-test:
    name: Flutter Tests & Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
          channel: stable
          cache: true
          cache-key: flutter-linux-${{ hashFiles('app/pubspec.lock') }}
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --machine > test-results.xml || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-results
          path: app/test-results.xml
          retention-days: 7

  backend-test:
    name: Backend Tests & Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fastapi-backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-cov pytest-asyncio httpx
      - run: pip install ruff && ruff check app/ --select=E,F --ignore=E501,F401 || true
      - run: pytest tests/ -v --tb=short

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: flutter-test
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
          channel: stable
          cache: true
          cache-key: flutter-linux-${{ hashFiles('app/pubspec.lock') }}
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: \${{ secrets.DOCKER_USERNAME }}
          password: \${{ secrets.DOCKER_PASSWORD }}
        if: github.event_name == push && github.ref == refs/heads/main
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: aurasocial/aura-api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: fastapi-backend
          push: false
          tags: \${{ steps.meta.outputs.tags }}
          labels: \${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max