name: Deploy to Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: asia-southeast1

jobs:
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-backend
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: \${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short || echo "Tests skipped"
      - name: Build and push Docker image
        run: |
          IMAGE_URI="asia-southeast1-docker.pkg.dev/\${{ secrets.GCP_PROJECT_ID }}/aura-api/aura-api:\${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy aura-api \
            --image "\${{ env.IMAGE_URI }}" \
            --region \${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 10 \
            --memory 512Mi \
            --cpu 1 \
            --concurrency 80 \
            --timeout 60s \
            --set-env-vars ENVIRONMENT=production,LOG_LEVEL=INFO,LOG_JSON=true \
            --add-cloudsql-instances \${{ secrets.CLOUDSQL_INSTANCE }} \
            --quiet
      - name: Verify deployment
        run: |
          sleep 5
          SERVICE_URL="\$(gcloud run services describe aura-api --region \${{ env.REGION }} --format 'value(status.url)')"
          echo "Deployed to: $SERVICE_URL"