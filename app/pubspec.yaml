name: app
description: "AURA Social – Ambient Emotional Intelligence Social Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # UI / Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  lottie: ^3.3.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP Client
  dio: ^5.7.0

  # Charts
  fl_chart: ^0.70.2

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_database: ^12.4.2
  firebase_storage: ^13.4.2
  firebase_messaging: ^16.3.0
  google_sign_in: ^6.2.2

  # Utils
  uuid: ^4.5.1
  timeago: ^3.7.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Auto-generate app icons cho Android + iOS từ 1 ảnh
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/aura_icon.png"
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/images/aura_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
